name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest

      - name: Run Android lint
        run: bash ./gradlew :app:lintDebug

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug

      - name: Validate generated store data
        run: python3 tools/convert_stores.py --check
