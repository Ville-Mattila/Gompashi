name: Refresh Store Data

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: Commit refreshed data back to the current branch
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Fetch latest Alko store export
        run: python3 tools/fetch_alko_stores.py

      - name: Convert and validate bundled data
        run: |
          python3 tools/convert_stores.py
          python3 tools/convert_stores.py --check

      - name: Show changed files
        run: git status --short

      - name: Commit refreshed data
        if: inputs.commit_changes == 'true'
        run: |
          if git diff --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stores.json app/src/main/assets/alko_stores.json app/src/main/assets/closed_dates.json web/alko_stores.json web/closed_dates.json
          git commit -m "Refresh Alko store data"
          git push

      - uses: actions/upload-artifact@v6
        with:
          name: refreshed-store-data
          path: |
            stores.json
            app/src/main/assets/alko_stores.json
            app/src/main/assets/closed_dates.json
            web/alko_stores.json
            web/closed_dates.json
