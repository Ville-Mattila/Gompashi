<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Gompashi</title>
  <meta name="description" content="Suunta ja etäisyys lähimpään Alkoon." />
  <meta name="theme-color" content="#000000" />
  <!-- Open Graph / link preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Gompashi" />
  <meta property="og:description" content="Suunta ja etäisyys lähimpään Alkoon." />
  <meta property="og:url" content="https://gompashi.vercel.app/" />
  <meta property="og:image" content="https://gompashi.vercel.app/assets/og-image.png" />
  <meta property="og:image:width" content="2400" />
  <meta property="og:image:height" content="1260" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Gompashi" />
  <meta name="twitter:description" content="Suunta ja etäisyys lähimpään Alkoon." />
  <meta name="twitter:image" content="https://gompashi.vercel.app/assets/og-image.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gompashi" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <img id="title" class="title" src="assets/title.svg" alt="Gompashi" />

    <div class="spacer"></div>

    <div class="hero">
      <div class="stage">
        <img id="north" class="north" src="assets/compass_needle_north.png" alt="" aria-hidden="true" />
        <div class="glow"></div>
        <img id="bottle" class="bottle" src="assets/compass_needle.png" alt="Suunta Alkoon" />
      </div>
      <div id="distance" class="distance" aria-live="polite"></div>
      <div id="store" class="store"></div>
      <div id="hours" class="hours"></div>
      <div id="hoursnote" class="hoursnote"></div>
      <div id="hint" class="hint"></div>
    </div>

    <div class="spacer"></div>

    <div id="toggle" class="toggle" role="tablist">
      <div class="pill" id="pill"></div>
      <button class="seg" data-rank="0" role="tab">Lähin</button>
      <button class="seg" data-rank="1" role="tab">Toiseksi lähin</button>
    </div>
  </main>

  <!-- Start / permission / error overlay -->
  <div id="overlay" class="overlay">
    <p id="overlayText">Gompashi näyttää suunnan ja etäisyyden lähimpään Alkoon.</p>
    <button id="overlayBtn" class="btn">Käynnistä</button>
    <p class="overlay-fine">Pidä puhelinta vaakatasossa kuten oikeaa kompassia.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
