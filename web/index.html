<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Gompashi</title>
  <meta name="description" content="Suunta ja etäisyys lähimpään Alkoon." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png" />
  <!-- Open Graph / link preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Gompashi" />
  <meta property="og:description" content="Suunta ja etäisyys lähimpään Alkoon." />
  <meta property="og:url" content="https://gompashi.vercel.app/" />
  <meta property="og:image" content="https://gompashi.vercel.app/assets/og-image.png" />
  <meta property="og:image:width" content="2400" />
  <meta property="og:image:height" content="1260" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Gompashi" />
  <meta name="twitter:description" content="Suunta ja etäisyys lähimpään Alkoon." />
  <meta name="twitter:image" content="https://gompashi.vercel.app/assets/og-image.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gompashi" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button id="settingsBtn" class="iconbtn" aria-label="Asetukset" title="Asetukset">⚙</button>
  <button id="mapBtn" class="iconbtn mapbtn" aria-label="Reittikartta" title="Reittikartta">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="6" cy="17.5" r="2" /><circle cx="18" cy="6.5" r="2" />
      <path d="M8 17.5h6a3 3 0 0 0 0-6H10a3 3 0 0 1 0-6h6" />
    </svg>
  </button>

  <main id="app">
    <img id="title" class="title" src="assets/title.svg" alt="Gompashi" />

    <div class="spacer"></div>

    <div class="hero">
      <div class="stage">
        <img id="north" class="north" src="assets/compass_needle_north.png" alt="" aria-hidden="true" />
        <div class="glow"></div>
        <img id="bottle" class="bottle" src="assets/compass_needle.png" alt="Suunta Alkoon" />
      </div>
      <div id="distance" class="distance" aria-live="polite"></div>
      <div id="store" class="store"></div>
      <div id="hours" class="hours"></div>
      <div id="hoursnote" class="hoursnote"></div>
      <div id="hint" class="hint"></div>
    </div>

    <div class="spacer"></div>

    <div id="toggle" class="toggle" role="tablist">
      <div class="pill" id="pill"></div>
      <button class="seg" data-rank="0" role="tab">Lähin</button>
      <button class="seg" data-rank="1" role="tab">Toiseksi lähin</button>
    </div>
  </main>

  <!-- Start / permission / error overlay -->
  <div id="overlay" class="overlay">
    <p id="overlayText">Gompashi näyttää suunnan ja etäisyyden lähimpään Alkoon.</p>
    <button id="overlayBtn" class="btn">Käynnistä</button>
    <p class="overlay-fine">Pidä puhelinta vaakatasossa kuten oikeaa kompassia.</p>
  </div>

  <!-- Settings: custom needle image + your own Alko stores (stored locally) -->
  <div id="settings" class="overlay settings hidden">
    <div class="panel">
      <h2>Asetukset</h2>

      <section>
        <h3>Kompassineula</h3>
        <img id="needlePreview" class="needle-preview" src="assets/compass_needle.png" alt="" />
        <div class="row">
          <label class="btn small">Vaihda kuva
            <input id="needleInput" type="file" accept="image/*" hidden />
          </label>
          <button id="needleReset" class="btn small ghost">Palauta oletus</button>
        </div>
      </section>

      <section>
        <h3>Oma Alko</h3>
        <p class="fine">Lisää myymälä, jota ei ole datassa. Tallentuu vain tähän laitteeseen.</p>
        <input id="customName" class="text-input" type="text" placeholder="Nimi (esim. Alko Mökkikylä)" />
        <button id="customAdd" class="btn small">Lisää nykyiseen sijaintiin</button>
        <p id="customMsg" class="fine"></p>
        <div id="customList" class="custom-list"></div>
      </section>

      <button id="settingsClose" class="btn">Sulje</button>
    </div>
  </div>

  <!-- Expandable walking-route map (themed canvas, no base tiles) -->
  <div id="mappanel" class="mappanel">
    <div class="maphead">
      <div id="maptoggle" class="maptoggle" role="tablist">
        <div class="mappill" id="mappill"></div>
        <button class="mapseg" data-rank="0" role="tab">Lähin</button>
        <button class="mapseg" data-rank="1" role="tab">Toiseksi lähin</button>
      </div>
      <button id="mapClose" class="mapclose" aria-label="Sulje kartta">✕</button>
    </div>
    <span id="mapinfo" class="mapinfo">Reittikartta</span>
    <canvas id="mapcanvas" class="mapcanvas"></canvas>
  </div>

  <script src="app.js"></script>
</body>
</html>
